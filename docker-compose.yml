name: telco-fleet-copilot

# Application services load configuration from .env via env_file, so a stale
# variable exported in your shell can no longer shadow .env. Only values that are
# specific to the compose network (service DNS names) are set inline; inline
# `environment` values always win over env_file.
#
# Reminder: exported shell variables still take precedence over .env for the
# ${...} substitutions below (host ports), so `unset` any stale ones.

services:
  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20

  postgres:
    image: postgres:16-alpine
    # Raised so a scaled detector fleet has connection headroom (default is 100).
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: aiops
      POSTGRES_PASSWORD: aiops
      POSTGRES_DB: aiops
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiops -d aiops"]
      interval: 5s
      timeout: 5s
      retries: 20

  collector:
    build:
      context: .
      dockerfile: collectors/Dockerfile
    env_file: .env
    environment:
      SERVICE_NAME: collector
    # No host port: lets the fleet scale to any replica count.
    #   docker compose up -d --build --scale collector=3
    # The API reaches it at http://collector:9100 across replicas.
    # For direct host access, uncomment a port range instead (limits scale to the range):
    # ports:
    #   - "9100-9109:9100"
    depends_on:
      kafka:
        condition: service_healthy

  consumer:
    build:
      context: .
      dockerfile: consumers/Dockerfile
    env_file: .env
    environment:
      SERVICE_NAME: consumer
      DETECTOR_URL: http://detector:9200
    # No host port: scales to any count (docker compose up -d --scale consumer=4).
    depends_on:
      kafka:
        condition: service_healthy
      detector:
        condition: service_started

  detector:
    build:
      context: .
      dockerfile: detectors/Dockerfile
    env_file: .env
    environment:
      SERVICE_NAME: detector
      DATABASE_URL: postgresql+psycopg2://aiops:aiops@postgres:5432/aiops
    # No host port: this is what makes scaling work.
    #   docker compose up -d --build --scale detector=5
    # Each replica gets a unique DETECTOR_ID from its container hostname, and the
    # consumers reach the fleet at http://detector:9200 (round-robined by Docker DNS).
    depends_on:
      postgres:
        condition: service_healthy

  inference:
    build:
      context: .
      dockerfile: inference/Dockerfile
    env_file: .env
    environment:
      SERVICE_NAME: inference
    ports:
      - "${INFERENCE_HOST_PORT:-9300}:9300"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: .env
    environment:
      SERVICE_NAME: api
      DATABASE_URL: postgresql+psycopg2://aiops:aiops@postgres:5432/aiops
      INFERENCE_URL: http://inference:9300
      DETECTOR_URL: http://detector:9200
      COLLECTOR_URL: http://collector:9100
      CONSUMER_URL: http://consumer:9150
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      inference:
        condition: service_started

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    env_file: .env
    environment:
      SERVICE_NAME: dashboard
      API_URL: http://api:8000
    ports:
      - "${DASHBOARD_HOST_PORT:-8501}:8501"
    depends_on:
      - api

volumes:
  postgres-data:
