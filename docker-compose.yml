services:
  reasoning-worker:
    build:
      context: .
      dockerfile: reasoning_worker/Dockerfile
    env_file: .env
    ports:
      - "9100:9100"

  detector:
    build:
      context: .
      dockerfile: detector/Dockerfile
    env_file: .env
    environment:
      WORKER_URL: http://reasoning-worker:9100
    ports:
      - "9000:9000"
    depends_on:
      - reasoning-worker

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    env_file: .env
    environment:
      WORKER_URL: http://reasoning-worker:9100
      DETECTOR_URL: http://detector:9000
    ports:
      - "8501:8501"
    depends_on:
      - reasoning-worker
      - detector
