# Platform services. Images follow the local build convention:
#   docker build -f collectors/Dockerfile -t telco-fleet-copilot/collector:latest .
# Replace the image names with your registry.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector
  namespace: aiops
spec:
  replicas: 3
  selector:
    matchLabels:
      app: collector
  template:
    metadata:
      labels:
        app: collector
    spec:
      serviceAccountName: aiops-collector
      containers:
        - name: collector
          image: telco-fleet-copilot/collector:latest
          ports:
            - containerPort: 9100
          envFrom:
            - configMapRef:
                name: aiops-config
          env:
            - name: SERVICE_NAME
              value: collector
            - name: COLLECTOR_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          readinessProbe:
            httpGet:
              path: /health
              port: 9100
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 9100
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: collector
  namespace: aiops
spec:
  selector:
    app: collector
  ports:
    - port: 9100
      targetPort: 9100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer
  namespace: aiops
spec:
  replicas: 4
  selector:
    matchLabels:
      app: consumer
  template:
    metadata:
      labels:
        app: consumer
    spec:
      containers:
        - name: consumer
          image: telco-fleet-copilot/consumer:latest
          ports:
            - containerPort: 9150
          envFrom:
            - configMapRef:
                name: aiops-config
          env:
            - name: SERVICE_NAME
              value: consumer
            - name: DETECTOR_URL
              value: http://detector.aiops.svc.cluster.local:9200
          readinessProbe:
            httpGet:
              path: /health
              port: 9150
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: consumer
  namespace: aiops
spec:
  selector:
    app: consumer
  ports:
    - port: 9150
      targetPort: 9150
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: detector
  namespace: aiops
spec:
  replicas: 4
  selector:
    matchLabels:
      app: detector
  template:
    metadata:
      labels:
        app: detector
    spec:
      containers:
        - name: detector
          image: telco-fleet-copilot/detector:latest
          ports:
            - containerPort: 9200
          envFrom:
            - configMapRef:
                name: aiops-config
          env:
            - name: SERVICE_NAME
              value: detector
            - name: DETECTOR_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: aiops-secrets
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /health
              port: 9200
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: detector
  namespace: aiops
spec:
  selector:
    app: detector
  ports:
    - port: 9200
      targetPort: 9200
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference
  namespace: aiops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inference
  template:
    metadata:
      labels:
        app: inference
    spec:
      containers:
        - name: inference
          image: telco-fleet-copilot/inference:latest
          ports:
            - containerPort: 9300
          envFrom:
            - configMapRef:
                name: aiops-config
          env:
            - name: SERVICE_NAME
              value: inference
            - name: NVIDIA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: aiops-secrets
                  key: NVIDIA_API_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: 9300
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: inference
  namespace: aiops
spec:
  selector:
    app: inference
  ports:
    - port: 9300
      targetPort: 9300
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: aiops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: telco-fleet-copilot/api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: aiops-config
          env:
            - name: SERVICE_NAME
              value: api
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: aiops-secrets
                  key: DATABASE_URL
            - name: INFERENCE_URL
              value: http://inference.aiops.svc.cluster.local:9300
            - name: DETECTOR_URL
              value: http://detector.aiops.svc.cluster.local:9200
            - name: COLLECTOR_URL
              value: http://collector.aiops.svc.cluster.local:9100
            - name: CONSUMER_URL
              value: http://consumer.aiops.svc.cluster.local:9150
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: aiops
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: aiops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      containers:
        - name: dashboard
          image: telco-fleet-copilot/dashboard:latest
          ports:
            - containerPort: 8501
          env:
            - name: API_URL
              value: http://api.aiops.svc.cluster.local:8000
          readinessProbe:
            httpGet:
              path: /
              port: 8501
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: aiops
spec:
  type: LoadBalancer
  selector:
    app: dashboard
  ports:
    - port: 80
      targetPort: 8501
